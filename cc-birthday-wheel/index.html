<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CC 生日礼物转盘</title>
  <style>
    :root {
      --ink: #342c28;
      --muted: #8e7c73;
      --paper: #fff9f5;
      --rose: #d85869;
      --line: #eaded8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      overflow-x: hidden;
      color: var(--ink);
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at 10% 8%, #ffdeda 0, transparent 30%),
        radial-gradient(circle at 92% 88%, #ffefbd 0, transparent 27%),
        var(--paper);
    }
    button { font: inherit; }
    .sparkle {
      position: fixed;
      color: #e57a87;
      opacity: .6;
      pointer-events: none;
      animation: float 4s ease-in-out infinite;
    }
    .sparkle.one { top: 10%; left: 9%; font-size: 24px; }
    .sparkle.two { right: 10%; bottom: 12%; color: #dcaa3c; font-size: 20px; animation-delay: -1.6s; }
    .shell {
      position: relative;
      width: min(560px, 100%);
      padding: 34px 24px 24px;
      overflow: hidden;
      text-align: center;
      border: 1px solid #ffffffaa;
      border-radius: 32px;
      background: #ffffff8f;
      box-shadow: 0 26px 80px #6c493516;
      backdrop-filter: blur(14px);
      animation: enter .6s ease both;
    }
    .shell::before {
      content: "";
      position: absolute;
      width: 170px;
      height: 170px;
      top: -95px;
      right: -65px;
      border: 1px solid #e9a7ae55;
      border-radius: 50%;
      box-shadow: 0 0 0 22px #f8c8cd1f, 0 0 0 46px #f8c8cd12;
    }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--rose);
      font-size: 9px;
      font-weight: 900;
      letter-spacing: .24em;
    }
    h1 {
      margin: 0;
      font-family: Georgia, "Songti SC", serif;
      font-size: clamp(42px, 9vw, 62px);
      font-weight: 500;
      letter-spacing: -.05em;
      line-height: 1.08;
    }
    .question { margin: 10px 0 20px; color: var(--muted); font-size: 14px; }
    .wheel-wrap {
      position: relative;
      width: min(360px, 82vw);
      aspect-ratio: 1;
      margin: auto;
      display: grid;
      place-items: center;
    }
    .pointer {
      position: absolute;
      z-index: 5;
      top: -1px;
      left: 50%;
      width: 0;
      height: 0;
      transform: translateX(-50%);
      border-left: 13px solid transparent;
      border-right: 13px solid transparent;
      border-top: 28px solid var(--ink);
      filter: drop-shadow(0 3px 1px #fff);
    }
    .wheel {
      position: relative;
      width: 92%;
      aspect-ratio: 1;
      overflow: hidden;
      border: 9px solid #fff;
      border-radius: 50%;
      outline: 1px solid #dacac2;
      box-shadow: 0 22px 54px #6b463522;
      background: #fff;
    }
    .wheel-disc {
      position: absolute;
      z-index: 1;
      inset: 0;
      border-radius: 50%;
      will-change: transform;
    }
    .wheel::after {
      content: "";
      position: absolute;
      z-index: 3;
      inset: 8%;
      border: 1px solid #ffffff75;
      border-radius: 50%;
      pointer-events: none;
    }
    .label {
      position: absolute;
      z-index: 2;
      left: 50%;
      top: 50%;
      width: 92px;
      height: 1px;
      margin-left: -46px;
      display: flex;
      justify-content: center;
      align-items: center;
      transform-origin: 46px 0;
      color: #fff;
      font-size: 11px;
      font-weight: 900;
      text-shadow: 0 1px 5px #43271f70;
      pointer-events: none;
    }
    .label b {
      display: block;
      width: 92px;
      overflow: hidden;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .spin {
      position: absolute;
      z-index: 6;
      width: 72px;
      height: 72px;
      border: 6px solid #fff;
      border-radius: 50%;
      background: var(--ink);
      color: #fff;
      font-size: 19px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 7px 20px #3d2e2738;
      transition: transform .18s ease, background .18s ease;
      animation: breathe 2.2s ease-in-out infinite;
    }
    .spin:hover:not(:disabled) { transform: scale(1.06); background: var(--rose); }
    .spin:active:not(:disabled) { transform: scale(.95); }
    .spin:disabled { cursor: wait; opacity: .76; animation: none; }
    .hint { margin: 14px 0 0; color: #a9988f; font-size: 11px; }
    .gift-count {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: #ffffff80;
      font-size: 10px;
    }
    .gift-count i { width: 5px; height: 5px; border-radius: 50%; background: var(--rose); }

    .modal {
      position: fixed;
      z-index: 40;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #2c211d80;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      backdrop-filter: blur(8px);
      transition: opacity .25s ease, visibility 0s linear .25s;
    }
    .modal.show { opacity: 1; visibility: visible; pointer-events: auto; transition-delay: 0s; }
    .modal-card {
      position: relative;
      width: min(410px, 100%);
      padding: 34px 26px 26px;
      overflow: hidden;
      text-align: center;
      border: 1px solid #fff;
      border-radius: 28px;
      background: #fffaf7;
      box-shadow: 0 30px 90px #21171345;
      transform: translateY(18px) scale(.94);
      transition: transform .35s cubic-bezier(.18,.8,.2,1.15);
    }
    .modal.show .modal-card { transform: translateY(0) scale(1); }
    .modal-card::before {
      content: "";
      position: absolute;
      inset: -70px auto auto -70px;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: #ffe2df;
    }
    .celebrate-icon {
      position: relative;
      width: 72px;
      height: 72px;
      margin: 0 auto 14px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #fff0d6;
      font-size: 38px;
      animation: pop .55s cubic-bezier(.15,.86,.24,1.25) both;
    }
    .modal-kicker { margin: 0 0 5px; color: var(--rose); font-size: 9px; font-weight: 900; letter-spacing: .22em; }
    .modal-card h2 { margin: 0; font-family: Georgia, "Songti SC", serif; font-size: 30px; font-weight: 500; }
    .prize {
      margin: 17px 0 10px;
      padding: 16px 12px;
      border: 1px solid #ecd9d4;
      border-radius: 16px;
      background: #fff;
      color: #b74454;
      font-family: Georgia, "Songti SC", serif;
      font-size: clamp(25px, 7vw, 34px);
      font-weight: 600;
    }
    .claim-note {
      margin: 12px 0 0;
      padding: 13px 14px;
      border-radius: 14px;
      background: #fff3eb;
      color: #6e554b;
      font-size: 13px;
      line-height: 1.7;
      text-align: left;
    }
    .claim-note strong {
      display: block;
      margin-bottom: 2px;
      color: var(--rose);
      font-size: 10px;
      letter-spacing: .12em;
    }
    .modal-note { margin: 12px 0 0; color: var(--muted); font-size: 12px; }
    .modal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 22px; }
    .modal-actions button { padding: 11px 12px; border-radius: 12px; font-weight: 800; cursor: pointer; }
    .again { border: 0; background: var(--ink); color: #fff; }
    .accept { border: 1px solid #ddcec7; background: transparent; color: var(--ink); }
    .close {
      position: absolute;
      z-index: 2;
      top: 12px;
      right: 14px;
      width: 34px;
      height: 34px;
      border: 0;
      background: transparent;
      color: #988980;
      font-size: 24px;
      cursor: pointer;
    }
    .confetti {
      position: fixed;
      z-index: 50;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .confetti-piece {
      position: absolute;
      top: -18px;
      width: 9px;
      height: 15px;
      border-radius: 2px;
      animation: fall var(--duration) linear var(--delay) forwards;
    }

    @keyframes enter { from { opacity: 0; transform: translateY(12px); } }
    @keyframes float { 50% { transform: translateY(-10px) rotate(12deg); } }
    @keyframes breathe { 50% { box-shadow: 0 7px 20px #3d2e2738, 0 0 0 8px #d8586910; } }
    @keyframes pop { 0% { transform: scale(.25) rotate(-15deg); } 75% { transform: scale(1.12) rotate(5deg); } }
    @keyframes fall {
      to { transform: translate3d(var(--drift), 108vh, 0) rotate(760deg); opacity: .9; }
    }
    @media (max-width: 480px) {
      body { padding: 12px; align-items: start; }
      .shell { padding: 25px 12px 18px; border-radius: 24px; }
      .question { margin-bottom: 12px; }
      .wheel-wrap { width: min(332px, 88vw); }
      .label { font-size: 10px; }
      .spin { width: 66px; height: 66px; border-width: 5px; }
      .modal-actions { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <span class="sparkle one">✦</span>
  <span class="sparkle two">✦</span>

  <main class="shell">
    <p class="eyebrow">MAKE A LITTLE WISH</p>
    <h1>CC 生日啦！</h1>
    <p class="question">这一次，会转到一份怎样的心意呢？</p>

    <div class="wheel-wrap">
      <div class="pointer" aria-hidden="true"></div>
      <div class="wheel" id="wheel" aria-label="生日礼物转盘">
        <div class="wheel-disc" id="wheel-disc"></div>
      </div>
      <button class="spin" id="spin" type="button">转</button>
    </div>

    <p class="hint">点击中央按钮，把礼物交给一点点运气。</p>
    <span class="gift-count"><i></i> 7 份生日心意</span>
  </main>

  <div class="modal" id="result-modal" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="result-title">
    <section class="modal-card">
      <button class="close" id="close" type="button" aria-label="关闭">×</button>
      <div class="celebrate-icon">🎉</div>
      <p class="modal-kicker">LUCKY PICK</p>
      <h2 id="result-title">嘿，命运发货啦！</h2>
      <div class="prize" id="gift-name">—</div>
      <div class="claim-note"><strong>领取小纸条</strong><span id="gift-note">—</span></div>
      <p class="modal-note">愿赌服输，这份快乐不许退货 ♡</p>
      <div class="modal-actions">
        <button class="again" id="again" type="button">不服，再转一次</button>
        <button class="accept" id="accept" type="button">好嘞，收下！</button>
      </div>
    </section>
  </div>
  <div class="confetti" id="confetti" aria-hidden="true"></div>

  <script>
    const gifts = [
      { wheel: "旅游基金", result: "旅游基金 ¥100", note: "下次准备出发时喊我一声，告诉我去哪儿，这笔旅行快乐金随叫随到。" },
      { wheel: "GPT 会员", result: "GPT 会员 ¥138", note: "一个月会员我来赞助，放心大胆问，别客气到连问题都舍不得发。" },
      { wheel: "新鞋子", result: "新鞋子 ¥150", note: "最近看中的那双鞋，买！¥150 报销额度已经给你安排上啦。" },
      { wheel: "新裤子", result: "新裤子 ¥80", note: "最近看中的裤子放心拿下，¥80 给你报销，不许偷偷嫌少哈哈。" },
      { wheel: "演唱会基金", result: "演唱会基金 ¥100", note: "看到想冲的演唱会就喊我，¥100 尖叫基金已经就位。" },
      { wheel: "5 杯奶茶", result: "5 杯奶茶", note: "想喝就来找我下单，一共 5 次。快乐可以续杯，次数可不许过期。" },
      { wheel: "已买衣服", result: "已买衣服 ¥120", note: "这件已经提前买好啦，价值 ¥120——礼物先到，惊喜现在补上。" }
    ];
    const colors = ["#ef8b73", "#efbb4f", "#91b5a4", "#9b8bc6", "#73a6c6", "#cf7798", "#d890bb"];
    const confettiColors = ["#ef8b73", "#efbb4f", "#7caec8", "#d76780", "#8cb8a2", "#9b8bc6"];
    const wheel = document.querySelector("#wheel");
    const wheelDisc = document.querySelector("#wheel-disc");
    const spinButton = document.querySelector("#spin");
    const modal = document.querySelector("#result-modal");
    const giftName = document.querySelector("#gift-name");
    const giftNote = document.querySelector("#gift-note");
    const confetti = document.querySelector("#confetti");
    const labelNodes = [];
    let rotation = 0;
    let spinning = false;

    const sliceSize = 360 / gifts.length;
    wheelDisc.style.background = `conic-gradient(${colors
      .map((color, index) => `${color} ${index * sliceSize}deg ${(index + 1) * sliceSize}deg`)
      .join(",")})`;

    gifts.forEach((gift, index) => {
      const angle = index * sliceSize + sliceSize / 2;
      const label = document.createElement("span");
      const text = document.createElement("b");
      label.className = "label";
      label.dataset.angle = String(angle);
      text.textContent = gift.wheel;
      label.appendChild(text);
      wheel.appendChild(label);
      labelNodes.push(label);
    });

    function normalize(value) {
      return ((value % 360) + 360) % 360;
    }

    function renderRotation(value) {
      const currentRotation = normalize(value);
      wheelDisc.style.transform = `rotate(${currentRotation}deg)`;
      labelNodes.forEach((label) => {
        const originalAngle = Number(label.dataset.angle);
        const positionAngle = normalize(originalAngle + currentRotation);
        label.style.transform = `rotate(${positionAngle}deg) translateY(-118px) rotate(${-positionAngle}deg)`;
      });
    }

    function animateRotation(from, to, duration, finished) {
      const startTime = performance.now();
      function frame(now) {
        const progress = Math.min((now - startTime) / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 4);
        renderRotation(from + (to - from) * eased);
        if (progress < 1) {
          requestAnimationFrame(frame);
        } else {
          rotation = to;
          renderRotation(rotation);
          finished();
        }
      }
      requestAnimationFrame(frame);
    }

    function celebrate() {
      confetti.innerHTML = "";
      for (let index = 0; index < 46; index += 1) {
        const piece = document.createElement("i");
        piece.className = "confetti-piece";
        piece.style.left = `${Math.random() * 100}%`;
        piece.style.background = confettiColors[index % confettiColors.length];
        piece.style.setProperty("--duration", `${2.6 + Math.random() * 1.6}s`);
        piece.style.setProperty("--delay", `${Math.random() * .45}s`);
        piece.style.setProperty("--drift", `${-90 + Math.random() * 180}px`);
        piece.style.transform = `rotate(${Math.random() * 180}deg)`;
        confetti.appendChild(piece);
      }
      window.setTimeout(() => { confetti.innerHTML = ""; }, 5400);
    }

    function openResult(gift) {
      giftName.textContent = gift.result;
      giftNote.textContent = gift.note;
      modal.classList.add("show");
      modal.setAttribute("aria-hidden", "false");
      celebrate();
    }

    function closeResult() {
      modal.classList.remove("show");
      modal.setAttribute("aria-hidden", "true");
    }

    function spin() {
      if (spinning) return;
      spinning = true;
      closeResult();
      spinButton.disabled = true;
      spinButton.textContent = "转动中";

      const index = Math.floor(Math.random() * gifts.length);
      const targetCenter = index * sliceSize + sliceSize / 2;
      const targetRotation = normalize(360 - targetCenter);
      const currentRotation = normalize(rotation);
      const turns = 5 + Math.floor(Math.random() * 3);
      const endRotation = rotation + turns * 360 + normalize(targetRotation - currentRotation);

      animateRotation(rotation, endRotation, 2750, () => {
        const pointerAngle = normalize(360 - normalize(rotation));
        const landedIndex = Math.floor(pointerAngle / sliceSize) % gifts.length;
        spinButton.textContent = "转";
        spinButton.disabled = false;
        spinning = false;
        openResult(gifts[landedIndex]);
      });
    }

    spinButton.addEventListener("click", spin);
    document.querySelector("#again").addEventListener("click", () => {
      closeResult();
      window.setTimeout(spin, 150);
    });
    document.querySelector("#accept").addEventListener("click", closeResult);
    document.querySelector("#close").addEventListener("click", closeResult);
    modal.addEventListener("click", (event) => {
      if (event.target === modal) closeResult();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closeResult();
    });
    renderRotation(0);
  </script>
</body>
</html>
